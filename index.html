<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1f4d">
<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#0f1730;--mut:#6b7491;--line:#e6e9f3;--pri:#14285f;--pri2:#f58220;--acc:#f58220;--acc2:#e06a00;--soft:#fdf0e3;--ok:#12a36b;--okb:#e3f6ee;--warn:#e8a317;--warnb:#fdf3dc;--bad:#d9455c;--badb:#fde8ec;--side:#0f1f4d;--side2:#1a2c63;--sidei:#c3c9e4;--shadow:0 1px 2px rgba(15,23,48,.04),0 4px 14px rgba(15,23,48,.05)}
body.dark{--bg:#0a1230;--card:#111c44;--ink:#eef0fb;--mut:#8f98bd;--line:#1c2549;--soft:#2a2440;--okb:#0f2e2a;--warnb:#33290f;--badb:#35151f;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;height:100%}
@font-face{font-family:"Cairo";src:url(fonts/Cairo.woff2) format("woff2");font-weight:200 1000;font-style:normal;font-display:swap}
body{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:262px;background:var(--side);color:var(--sidei);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;border-left:1px solid #1b2450}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 16px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ff9a3c,#e06a00);display:grid;place-items:center;box-shadow:0 6px 18px rgba(245,130,32,.45)}
.logo svg{width:22px;height:22px}
.brand b{display:block;color:#fff;font-size:17px}.brand small{color:#8e98c4;font-size:12px}
.nav{flex:1;overflow:auto;padding:4px 14px 12px}
.sec{font-size:12px;color:#7c86b3;margin:18px 8px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--sidei);cursor:pointer;margin-bottom:2px;font-size:14px;user-select:none}
.nav a:hover{background:var(--side2)}
.nav a.on{background:linear-gradient(90deg,#26397f,#1d2f6e);color:#fff;box-shadow:inset -3px 0 0 var(--pri2)}
.nav a svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sfoot{padding:14px 20px;border-top:1px solid #1b2450;font-size:12px;color:#8e98c4}
.main{flex:1;min-width:0}
.top{height:68px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:5}
.crumb small{color:var(--mut);font-size:12px;display:block}.crumb h1{margin:0;font-size:22px}
.sp{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px;width:300px;background:var(--card)}
.search input{border:0;outline:0;background:transparent;flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap}
.btn{color:var(--pri);border-color:var(--pri);background:#fff}body.dark .btn{background:transparent;color:#fff;border-color:#3a4c88}.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.p{background:linear-gradient(180deg,#ff9a3c,var(--acc2));color:#fff!important;border-color:var(--acc2);box-shadow:0 6px 16px rgba(245,130,32,.35)}.btn.p:hover{filter:brightness(1.06);color:#fff}
.btn.s{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.d{color:var(--bad);background:var(--badb);border-color:transparent}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.user{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:30px;padding:4px 14px 4px 6px;background:var(--card)}
.av{width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.live{font-size:12px;color:var(--ok);background:var(--okb);padding:4px 10px;border-radius:20px;font-weight:700}
.page{padding:26px 28px 50px;max-width:1500px}
.hello{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.hello h2{margin:0;font-size:26px}.hello p{margin:6px 0 0;color:var(--mut)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--pri);font-weight:700;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1.7fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.kpi{position:relative;overflow:hidden}
.kh{display:flex;justify-content:space-between;align-items:flex-start;color:var(--mut);margin-bottom:10px}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{background:var(--soft);color:var(--pri)}.ig{background:var(--okb);color:var(--ok)}.iy{background:var(--warnb);color:var(--warn)}.ir{background:var(--badb);color:var(--bad)}.ix{background:var(--line);color:var(--mut)}
.kv{font-size:28px;font-weight:800;letter-spacing:-.5px}.kv small{font-size:13px;color:var(--mut);font-weight:500;margin-inline-start:6px}
.ks{color:var(--mut);font-size:13px;margin-top:6px}
.kpi.sm .kv{font-size:22px}
.spark{position:absolute;left:0;right:0;bottom:0;height:26px;width:100%;opacity:.35;z-index:0;pointer-events:none}.kpi>div{position:relative;z-index:1}
.ct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ct h3{margin:0;font-size:17px}.ct small{color:var(--mut);display:block;margin-top:3px}
.leg{display:flex;gap:14px;color:var(--mut);font-size:13px}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%}
th{background:var(--bg);color:var(--mut);font-weight:600;text-align:right;padding:12px 14px;font-size:13px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg)}
td.n,th.n{text-align:left;direction:ltr}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.t-ok{background:var(--okb);color:var(--ok)}.t-bad{background:var(--badb);color:var(--bad)}.t-warn{background:var(--warnb);color:var(--warn)}.t-b{background:var(--soft);color:var(--pri)}
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tools .search{width:320px}
.mini{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.mini .card{flex:1;min-width:150px;padding:14px 16px}
.mini b{display:block;font-size:22px;margin-top:4px}
.mini span{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--line);border-radius:10px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#14285f,#f58220);border-radius:10px}.dr span{display:block}.mb2{display:block;height:5px;background:var(--line);border-radius:5px;margin-top:5px;overflow:hidden}.mb2 u{display:block;height:100%;border-radius:5px}.rg{flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(5,9,26,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mb{background:var(--card);border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:24px;border:1px solid var(--line)}
.mb h3{margin:0 0 16px;font-size:19px}
.fld{margin-bottom:13px}.fld label{display:block;color:var(--mut);font-size:13px;margin-bottom:6px}
.fld input,.fld select{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--bg);outline:0}
.fld input:focus,.fld select:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(245,130,32,.2)}
.fr{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.donutwrap{display:flex;flex-direction:column;align-items:center}
.dl{width:100%;margin-top:14px}.dl div{display:flex;align-items:center;gap:8px;padding:6px 0}.dl i{width:10px;height:10px;border-radius:3px}.dl span{flex:1}.dl b{direction:ltr}
.note{background:var(--soft);color:var(--pri);padding:12px 16px;border-radius:12px;margin-bottom:16px;line-height:1.7}
.toast{position:fixed;bottom:24px;left:24px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
.burger{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.search{width:200px}}
@media(max-width:820px){.side{position:fixed;right:0;top:0;z-index:40;transform:translateX(100%);transition:.25s}.side.open{transform:none}.burger{display:inline-flex}.top{padding:0 14px}.page{padding:18px 14px 40px}.g3,.g4{grid-template-columns:1fr 1fr}.search{display:none}.user .nm{display:none}.live{display:none}.kv{font-size:22px}}
@media(max-width:520px){.g3,.g4{grid-template-columns:1fr}}
@media(max-width:820px){html,body{overflow-x:hidden}.main{width:100%;min-width:0}.crumb h1{font-size:17px}.crumb small{display:none}.top .btn.p{padding:0 10px}.top{gap:8px}.hello h2{font-size:20px}.tw{max-width:100%}.mini .card{min-width:120px}}
@media print{.side,.top,.tools,.btn{display:none!important}.page{padding:0}}

.side{background:linear-gradient(180deg,#ff9238,#f58220)!important;color:#14285f!important;border-left:1px solid #e06a00!important}
.side .brand b{color:#14285f!important}.side .brand small{color:#5a3a12!important}
.side .logo{background:#14285f!important;box-shadow:0 6px 18px rgba(20,40,95,.35)!important}
.side .sec{color:#7a3d00!important}
.nav a{color:#14285f!important;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.28)!important}
.nav a.on{background:#fff!important;color:#14285f!important;box-shadow:inset -3px 0 0 #14285f!important}
.nav a svg{stroke:#14285f!important}
.ic svg,.kpi .ic svg{stroke:#14285f!important}
.ic{background:#e8ecf7!important;color:#14285f!important}
body.dark .ic svg{stroke:#fff!important}body.dark .ic{background:#1c2a5c!important}
.sfoot{color:#14285f!important;border-top-color:rgba(20,40,95,.25)!important}
/* v4: navy side menu, white text */
.side{background:#0f1f4d!important;color:#fff!important;border-left:1px solid #1b2450!important}
.side .brand b{color:#fff!important}.side .brand small{color:#c3c9e4!important}
.side .logo{background:#f58220!important;box-shadow:0 6px 18px rgba(0,0,0,.3)!important}
.side .sec{color:#f9b06b!important}
.nav a{color:#fff!important;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.12)!important}
.nav a.on{background:linear-gradient(90deg,#26397f,#1d2f6e)!important;color:#fff!important;box-shadow:inset -3px 0 0 #f58220!important}
.nav a svg{stroke:#fff!important}
.sfoot{color:#c3c9e4!important;border-top-color:rgba(255,255,255,.2)!important}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
 <div class="brand"><div class="logo" id="brandLogo"></div><div><b id="coName">مصنع الأثاث</b><small>نظام ERP للتصنيع</small></div></div>
 <nav class="nav" id="nav"></nav>
 <div class="sfoot">نظام ERP · الإصدار 7<br>البيانات محفوظة على جهازك</div>
</aside>
<div class="main">
 <header class="top">
  <button class="btn burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
  <div class="crumb"><small id="crumbS">الرئيسية</small><h1 id="crumbT">لوحة التحكم</h1></div>
  <div class="sp"></div>
  <div class="search"><span style="color:var(--mut)">⌕</span><input id="gs" placeholder="ابحث أو انتقل إلى..."></div>
  <button class="btn" onclick="printPage()" title="طباعة الصفحة الحالية">🖨 طباعة</button>
  <button class="btn p" onclick="quick()">＋ إجراء سريع</button>
  <button class="btn" onclick="toggleDark()" title="الوضع الليلي">☾</button>
  <span class="live">● Live</span>
  <div class="user"><div class="av">م</div><div class="nm"><b style="display:block;font-size:13px">المدير</b><small style="color:var(--mut)">مدير النظام</small></div></div>
 </header>
 <div class="page" id="page"></div>
</div>
</div>
<div class="modal" id="modal"><div class="mb" id="mb"></div></div>
<div class="toast" id="toast"></div>

const ic=n=>`<svg viewBox="0 0 24 24">${ICONS[n]}</svg>`;
const today=()=>new Date().toISOString().slice(0,10);
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
function sample(){return{
 co:'مصنع الأثاث',

  {id:1,code:'M01',name:'خشب زان',unit:'متر',price:9500,opening:5},
  {id:2,code:'M02',name:'MDF 18مم',unit:'لوح',price:1100,opening:20},
  {id:3,code:'M03',name:'قماش تنجيد',unit:'متر',price:320,opening:40},
  {id:4,code:'M04',name:'إسفنج',unit:'متر',price:450,opening:15},
  {id:5,code:'M05',name:'مسامير ومفصلات',unit:'طقم',price:60,opening:200},
  {id:6,code:'M06',name:'دهان ولاكيه',unit:'لتر',price:250,opening:30}],

  {id:2,date:dAgo(21),cat:'كهرباء ومياه',desc:'فاتورة الكهرباء',amount:3500},

}}
const KEY='furniture_erp_v1';
let DB;try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}

// ---------- calculations ----------
function calc(){
 const bomCost={};
 DB.bom.forEach(b=>{const m=mat(b.material);bomCost[b.product]=(bomCost[b.product]||0)+b.qty*(m?m.price:0)});
 const unitCost={};
 DB.products.forEach(p=>{unitCost[p.code]=(bomCost[p.code]||0)+(+p.labor||0)+(+p.overhead||0)});
 const prod={};DB.production.forEach(x=>prod[x.product]=(prod[x.product]||0)+x.qty);
 const stock=DB.materials.map(m=>{
  const bought=DB.purchases.filter(p=>p.material===m.code).reduce((s,p)=>s+p.qty,0);
  const used=DB.bom.filter(b=>b.material===m.code).reduce((s,b)=>s+b.qty*(prod[b.product]||0),0);
  const pret=DB.preturns.filter(p=>p.material===m.code).reduce((s,p)=>s+(+p.qty||0),0);
  const cadj=DB.counts.filter(c=>c.material===m.code).reduce((s,c)=>s+(+c.adj||0),0);
  const bal=m.opening+bought-used-pret+cadj;return{...m,bought,used,pret,cadj,bal,val:bal*m.price}});
 const made={},sold={};DB.production.forEach(x=>made[x.product]=(made[x.product]||0)+x.qty);DB.sales.forEach(x=>sold[x.product]=(sold[x.product]||0)+x.qty);DB.sreturns.forEach(x=>sold[x.product]=(sold[x.product]||0)-(+x.qty||0));
 const pstock={};DB.products.forEach(p=>pstock[p.code]=(made[p.code]||0)-(sold[p.code]||0));
 return{bomCost,unitCost,stock,prod,pstock,made,sold};
}

 const short=C.stock.filter(m=>m.bal<0).length, low=C.stock.filter(m=>m.bal>=0&&m.bal<=(m.min??5)).length;
 return{C,sales,cogs,gross:sales-cogs,exp,net:sales-cogs-exp,rec,purch,prodCost,recv,pay,stockVal,short,low,nS:S.length,nP:P.length,paidSup:P.reduce((s,x)=>s+x.paid,0)};
}

function spark(vals,col){if(!vals.length)return'';const mx=Math.max(...vals,1),w=100,h=30;const pts=vals.map((v,i)=>`${(i/(vals.length-1||1))*w},${h-2-(v/mx)*(h-6)}`).join(' ');return`<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`}
function series(days){
 const n=days||30,labels=[],S=[],P=[];
 for(let i=n-1;i>=0;i--){const d=dAgo(i);labels.push(d);
  S.push(DB.sales.filter(x=>x.date===d).reduce((s,x)=>s+x.qty*x.price,0));
  P.push(DB.purchases.filter(x=>x.date===d).reduce((s,x)=>s+x.qty*x.price,0));}
 return{labels,S,P};
}
function lineChart(days){
 const{labels,S,P}=series(days),n=labels.length,k=Math.max(1,Math.ceil(n/10)),B=[];
 for(let a=0;a<n;a+=k){const sl=x=>x.slice(a,a+k).reduce((p,q)=>p+q,0);B.push({l:labels[a],s:sl(S),p:sl(P)})}
 const W=720,H=250,pl=44,pb=26,pt=12,pr=10,mx=Math.max(...B.map(b=>Math.max(b.s,b.p)),1000),step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/step)*step;
 const y=v=>pt+(1-v/top)*(H-pt-pb),gw=(W-pl-pr)/B.length,bw=Math.min(30,gw*.36);
 let g='';for(let q=0;q<=4;q++){const v=top*q/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${v>=1000?fmt(v/1000)+'K':v}</text>`}
 const bar=(x,v,f,t)=>v>0?`<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(y(0)-y(v),2)}" rx="${Math.min(6,bw/2)}" fill="${f}"><title>${t}: ${fmt(v)} ج.م</title></rect>`:'';
 let o='';B.forEach((b,i)=>{const cx=pl+gw*i+gw/2;o+=bar(cx-bw-1.5,b.s,'url(#gS)',b.l+' مبيعات')+bar(cx+1.5,b.p,'url(#gP)',b.l+' مشتريات')+`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mut)">${b.l.slice(5).replace('-','/')}</text>`});
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr"><defs><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3c"/><stop offset="1" stop-color="#f58220"/></linearGradient><linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d56a0"/><stop offset="1" stop-color="#14285f"/></linearGradient></defs>${g}${o}</svg>`;
}
const PAL=['#14285f','#f58220','#4a62a8','#ffb066','#8f9fd0','#c75f00','#2c3f80','#ffd9b0'];
function ring(p,sz,col){p=Math.max(0,Math.min(100,p));const r=16,c=2*Math.PI*r;return`<svg class="rg" viewBox="0 0 40 40" style="width:${sz||46}px;height:${sz||46}px;direction:ltr"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="${col||'#f58220'}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 20 20)"/><text x="20" y="23.5" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink)">${Math.round(p)}%</text></svg>`}
function donut(items,centerTop,centerSub){
 const tot=items.reduce((s,i)=>s+i.v,0)||1,r=70,c=2*Math.PI*r,gap=items.filter(i=>i.v>0).length>1?5:0;let off=0,out=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/>`;
 items.forEach((it,k)=>{if(it.v<=0)return;const len=Math.max(it.v/tot*c-gap,1);out+=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${PAL[k%PAL.length]}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 100 100)"/>`;off+=it.v/tot*c});
 return`<svg viewBox="0 0 200 200" style="width:210px"><circle cx="100" cy="100" r="54" fill="var(--soft)" opacity=".6"/>${out}<text x="100" y="104" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)">${centerTop}</text><text x="100" y="124" text-anchor="middle" font-size="11" fill="var(--mut)">${centerSub}</text></svg>`;
}

function cell(cfg,k,r,fm){

function accTrial(){
 const T=totals(0),C=T.C;
 const fg=DB.products.reduce((s2,p2)=>s2+Math.max(0,C.pstock[p2.code]||0)*(C.unitCost[p2.code]||0),0);
 let custB=0;custNames().forEach(n=>custB+=partyBal(n,'عميل').b);
 let supB=0;supNames().forEach(n=>supB+=partyBal(n,'مورد').b);
 const cap=DB.capital.reduce((s2,c)=>s2+(c.type==='إيداع'?+c.amount:-(+c.amount)),0);
 const sret=DB.sreturns.reduce((s2,x)=>s2+x.qty*x.price-(+x.refund||0),0);
 const pret=DB.preturns.reduce((s2,x)=>s2+x.qty*x.price-(+x.refund||0),0);
 const sal=DB.payroll.filter(p2=>p2.status==='معتمدة').reduce((s2,p2)=>s2+(+p2.salary||0)+(+p2.bonus||0)-(+p2.deduct||0),0);
 const banks=DB.banks.reduce((s2,b)=>s2+bankBal(b.code),0);
 const treas=DB.treasuries.reduce((s2,t)=>s2+treasuryBal(t.code),0);
 const sales=DB.sales.reduce((s2,x)=>s2+x.qty*x.price,0),purch=DB.purchases.reduce((s2,x)=>s2+x.qty*x.price,0);
 return{rows:[
  ['1100','الخزينة',treas,0],['1200','البنك',banks,0],['1300','العملاء (مدينون)',custB,0],['1400','المخزون',T.stockVal+fg,0],
  ['2100','الموردون (دائنون)',0,supB],['3100','رأس المال',0,cap],
  ['4100','المبيعات',0,sales],['4200','مردودات المبيعات',sret,0],
  ['5100','تكلفة البضاعة المباعة',T.cogs,0],['5200','المصروفات',T.exp,0],['5200-SAL','مخصص الرواتب',sal,0],['5300','المشتريات',purch-pret,0]
 ].map(r=>r[2]<0?[r[0],r[1],0,-r[2]]:r[3]<0?[r[0],r[1],-r[3],0]:r),custB,supB,cap,fg,T,banks,treas,sales,purch,sret,pret,sal};
}

// ---------- v6: CSV import/export for every table ----------
function parseCSV(t){const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else{if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
   else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}
 row.push(cur);rows.push(row);return rows}
function importCSV(key,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const cfg=CFG[key];const rows=parseCSV(String(r.result).replace(/^\ufeff/,''));if(rows.length<2)throw 0;
  const hdr=rows[0].map(h=>String(h).trim());
  const colmap=cfg.cols.filter(c=>c[4]!==1&&!String(c[0]).startsWith('_')).map(c=>[c[0],hdr.indexOf(c[1])]).filter(x=>x[1]>=0);
  if(!colmap.length)throw 0;let n=0;
  rows.slice(1).forEach(cols=>{if(!cols.some(v=>String(v).trim()))return;const o={};
   colmap.forEach(([k,i])=>{let v=String(cols[i]??'').trim();
    const fdef=((cfg.form.find(ff=>ff[0]===k)||[])[2])||'';
    if(fdef.startsWith('sel:')){const src=DB[fdef.slice(4)]||[];const hit=src.find(x=>x.name===v||x.code===v);if(hit)v=hit.code}
    else if(fdef==='number'){v=+String(v).replace(/,/g,'')||0}
    else if(fdef.startsWith('opt:')){const pr=fdef.slice(4).split('|').map(o2=>o2.includes('=')?o2.split('='):[o2,o2]);const hit=pr.find(x=>x[0]===v||x[1]===v);if(hit)v=hit[1]}
    o[k]=v});
   if(cfg.form.some(f2=>f2[2]==='text'&&f2[0]!=='desc'&&f2[0]!=='note'&&!o[f2[0]]))return;
   o.id=nid(DB[cfg.list]);DB[cfg.list].push(o);n++});
  save();render();toast('تم استيراد '+n+' صفاً')}catch(e){toast('تعذر قراءة الملف')}};
 r.readAsText(f)}

let FORM=null;
function openForm(key,id){
 const cfg=CFG[key];const rec=id?{...DB[cfg.list].find(x=>x.id===id)}:cfg.def();FORM={key,id,rec};
 const f=cfg.form.map(([k,l,t])=>{let inp;
  if(t.startsWith('opt:')){const opts=t.slice(4).split('|');inp=`<select name="${k}">${opts.map(o=>{const[l,v]=o.includes('=')?o.split('='):[o,o];return`<option value="${v}" ${rec[k]===v?'selected':''}>${l}</option>`}).join('')}</select>`}
  else if(t.startsWith('sel:')){const src=t.slice(4);inp=`<select name="${k}">${DB[src].map(o=>`<option value="${esc(o.code)}" ${rec[k]===o.code?'selected':''}>${esc(o.name)} (${esc(o.code)})</option>`).join('')}</select>`}
  else inp=`<input name="${k}" type="${t}" ${t==='number'?'step="any"':''} value="${esc(rec[k]??'')}">`;
  return`<div class="fld"><label>${l}</label>${inp}</div>`}).join('');
 document.getElementById('mb').innerHTML=`<h3>${id?'تعديل':'إضافة'} ${cfg.title}</h3><form onsubmit="return submitForm(event)">${f}<div class="fr"><button class="btn p" type="submit">حفظ</button><button type="button" class="btn" onclick="closeM()">إلغاء</button></div></form>`;
 document.getElementById('modal').classList.add('on');
}
function closeM(){document.getElementById('modal').classList.remove('on')}
function submitForm(e){e.preventDefault();const{key,id,rec}=FORM,cfg=CFG[key],fd=new FormData(e.target);
 for(const[k,l,t]of cfg.form){let v=fd.get(k);if(t==='number')v=+v||0;else v=(v||'').trim();if((t==='text'&&k!=='desc')&&!v){toast('املأ الحقل: '+l);return false}rec[k]=v}
 if((key==='materials'||key==='products')&&DB[cfg.list].some(x=>x.code===rec.code&&x.id!==id)){toast('الكود مستخدم من قبل');return false}
 if(id){const i=DB[cfg.list].findIndex(x=>x.id===id);const old=DB[cfg.list][i];
  if(key==='materials'&&old.code!==rec.code){DB.bom.forEach(b=>{if(b.material===old.code)b.material=rec.code});DB.purchases.forEach(b=>{if(b.material===old.code)b.material=rec.code})}
  if(key==='products'&&old.code!==rec.code){[DB.bom,DB.production,DB.sales].forEach(a=>a.forEach(b=>{if(b.product===old.code)b.product=rec.code}))}
  DB[cfg.list][i]=rec}
 else{if(key==='counts'){const st=calc().stock.find(x=>x.code===rec.material);rec.adj=(+rec.actual||0)-(st?st.bal:0)}
  rec.id=nid(DB[cfg.list]);DB[cfg.list].push(rec)}
 save();closeM();render();toast('تم الحفظ');return false}
function del(key,id){if(!confirm('هل تريد الحذف؟'))return;const cfg=CFG[key];DB[cfg.list]=DB[cfg.list].filter(x=>x.id!==id);save();render();toast('تم الحذف')}

function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function exportJSON(){dl('furniture-erp-backup-'+today()+'.json',JSON.stringify(DB),'application/json')}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.materials)throw 0;DB=d;save();render();toast('تم الاستيراد')}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}
function exportCSV(k){const cfg=CFG[k],rows=cfg.rows();const cols=cfg.cols.filter(c=>c[0]!=='_st');const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 dl(k+'.csv','\ufeff'+[cols.map(c=>q(c[1])).join(','),...rows.map(r=>cols.map(c=>q(r[c[0]])).join(','))].join('\n'),'text/csv;charset=utf-8')}
function resetData(empty){if(!confirm(empty?'مسح كل البيانات نهائياً؟':'استبدال البيانات الحالية بالبيانات التجريبية؟'))return;const co=DB.co;DB=empty?blankDB(co):sample();NEWLISTS.forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[]});DB.st=DB.st||{phone:'',addr:'',tax:'',vat:14,vaton:false};seedNew();save();render();toast('تم')}
try{if(localStorage.getItem(KEY+'_dark'))document.body.classList.add('dark')}catch(e){}
if(location.hash.includes("dark"))document.body.classList.add('dark');
if(location.hash.startsWith('#v=')){VIEW=location.hash.slice(3)}
render();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
